name: Deploy test website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flicksy-test-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: flicksy-web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: flicksy-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test
      - name: Configure Creem test secret
        env:
          CREEM_API_KEY: ${{ secrets.CREEM_API_KEY }}
        run: |
          [[ "$CREEM_API_KEY" == creem_test_* ]] || { echo "Expected a Creem test API key" >&2; exit 1; }
          printf '%s' "$CREEM_API_KEY" | pnpm exec wrangler secret put CREEM_API_KEY --env test
      - run: pnpm deploy:test
