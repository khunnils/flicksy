name: Release direct app

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (for example 1.0)
        required: true
      build:
        description: Integer build number
        required: true
      tag:
        description: GitHub release tag (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure build paths
        run: |
          echo "ARCHIVE_PATH=$RUNNER_TEMP/Flicksy.xcarchive" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/export" >> "$GITHUB_ENV"
          echo "UPDATES_PATH=$RUNNER_TEMP/updates" >> "$GITHUB_ENV"
          echo "DMG_PATH=$RUNNER_TEMP/updates/Flicksy-${{ inputs.version }}.dmg" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/release.p12"
          keychain_path="$RUNNER_TEMP/release.keychain-db"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$certificate_path"
          [[ -s "$certificate_path" ]] || { echo "BUILD_CERTIFICATE_BASE64 decoded to an empty file" >&2; exit 1; }
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          # Import the full identity (cert + private key). Do not pass -t cert.
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security find-identity -v -p codesigning "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -q "Developer ID Application"

      - name: Test and archive direct build
        working-directory: flicksy-app
        run: |
          set -o pipefail
          common=(
            -project Flicksy.xcodeproj -scheme Flicksy
            MARKETING_VERSION='${{ inputs.version }}'
            CURRENT_PROJECT_VERSION='${{ inputs.build }}'
            DEVELOPMENT_TEAM='${{ vars.APPLE_TEAM_ID }}'
            FLICKSY_CHECKOUT_URL='${{ vars.FLICKSY_CHECKOUT_URL }}'
            FLICKSY_LICENSE_API_URL='${{ vars.FLICKSY_LICENSE_API_URL }}'
            SPARKLE_FEED_URL='https://flicksy.app/updates/appcast.xml'
            SPARKLE_PUBLIC_ED_KEY='${{ vars.SPARKLE_PUBLIC_ED_KEY }}'
          )
          # CI only has Developer ID. Tests do not need Mac Development signing.
          xcodebuild test "${common[@]}" -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
          xcodebuild archive "${common[@]}" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application'

      - name: Export and verify direct app
        working-directory: flicksy-app
        run: |
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "$EXPORT_PATH" -exportOptionsPlist Release/ExportOptions-DeveloperID.plist
          Release/verify-channel.sh direct "$EXPORT_PATH/Flicksy.app"

      - name: Create, notarize, and staple DMG
        working-directory: flicksy-app
        env:
          NOTARY_APPLE_ID: ${{ vars.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          NOTARY_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          mkdir -p "$UPDATES_PATH"
          Release/create-dmg.sh "$EXPORT_PATH/Flicksy.app" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID" --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          # spctl on a DMG container often reports "no usable signature" even when
          # notarization/stapling succeeded. Assess the app inside instead.
          mount_point="$RUNNER_TEMP/flicksy-dmg-mount"
          mkdir -p "$mount_point"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$mount_point"
          spctl --assess --type execute --verbose=2 "$mount_point/Flicksy.app"
          hdiutil detach "$mount_point"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ inputs.tag }}' "$DMG_PATH" --title 'Flicksy ${{ inputs.version }}' --generate-notes
          cp "$DMG_PATH" "$RUNNER_TEMP/Flicksy.dmg"
          gh release upload '${{ inputs.tag }}' "$RUNNER_TEMP/Flicksy.dmg"

      - name: Generate and publish signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          sparkle_bin="$(find ~/Library/Developer/Xcode/DerivedData -path '*/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast' -print -quit)"
          [[ -x "$sparkle_bin" ]]
          private_key="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$private_key"
          "$sparkle_bin" --ed-key-file "$private_key" --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/" "$UPDATES_PATH"
          cp "$UPDATES_PATH/appcast.xml" flicksy-web/public/updates/appcast.xml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add flicksy-web/public/updates/appcast.xml
          git commit -m 'Publish Flicksy ${{ inputs.version }} appcast'
          git push
